name: ClearFlow Dental validation

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "appwrite/functions/clearflow-dental-api/**"
      - ".github/workflows/clearflow-dental-build.yml"
      - ".github/workflows/deploy-appwrite-windmill-bridge.yml"
      - ".github/workflows/deploy-dental-api.yml"
      - "appwrite/schema/**"
      - "scripts/appwrite-schema/**"
      - ".github/workflows/verify-appwrite-schema.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "appwrite/functions/clearflow-dental-api/**"
      - ".github/workflows/clearflow-dental-build.yml"
      - ".github/workflows/deploy-appwrite-windmill-bridge.yml"
      - ".github/workflows/deploy-dental-api.yml"
      - "appwrite/schema/**"
      - "scripts/appwrite-schema/**"
      - ".github/workflows/verify-appwrite-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearflow-dental-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build Vue frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build

  backend:
    name: Test Appwrite API function
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appwrite/functions/clearflow-dental-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: npm install
      - name: Run backend unit tests
        run: npm test
