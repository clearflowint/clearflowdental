name: ClearFlow Dental feature-branch build

on:
  push:
    branches:
      - feature/appwrite-ai-integration
    paths:
      - "app/**"
      - ".github/workflows/clearflow-dental-build.yml"
  pull_request:
    branches:
      - feature/appwrite-ai-integration
    paths:
      - "app/**"
      - ".github/workflows/clearflow-dental-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearflow-dental-feature-build
  cancel-in-progress: true

jobs:
  build:
    name: Install and build Vue application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build
