name: Deploy ClearFlow Dental prototype

# Cloudflare Pages Git integration already deploys commits from this repository.
# Keep a manual-only workflow as an explicit fallback; do not deploy on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearflow-dental-pages-manual
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: clearflowdental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build application
        working-directory: app
        run: npm install && npm run build
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
      - name: Deploy preview or production branch
        run: npx wrangler pages deploy app/dist --project-name "$PAGES_PROJECT" --branch "$GITHUB_REF_NAME"
