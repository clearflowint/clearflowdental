name: Prototype deterministic Python tests

on:
  push:
    branches: [main, "prototype/**"]
    paths:
      - "windmill/dental/**"
      - ".github/workflows/prototype-python-tests.yml"
  pull_request:
    paths:
      - "windmill/dental/**"
      - ".github/workflows/prototype-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic workflow tests
        run: python -m unittest discover -s windmill/dental/tests -v
