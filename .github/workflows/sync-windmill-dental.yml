name: Validate dental Windmill sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windmill-dental-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Dry-run dental folder sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Windmill CLI
        run: npm install --global windmill-cli@1.850.0

      - name: Validate configuration and preview dental sync
        env:
          WMILL_URL: ${{ secrets.WMILL_URL }}
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
          WMILL_WORKSPACE: ${{ vars.WMILL_WORKSPACE }}
        run: |
          set -euo pipefail
          test -n "$WMILL_URL" || { echo "Missing GitHub Actions secret WMILL_URL"; exit 1; }
          test -n "$WMILL_TOKEN" || { echo "Missing GitHub Actions secret WMILL_TOKEN"; exit 1; }
          test -n "$WMILL_WORKSPACE" || { echo "Missing GitHub Actions variable WMILL_WORKSPACE"; exit 1; }

          # Register the remote workspace in this temporary runner's local Windmill CLI config.
          # This does not create a remote workspace unless --create is explicitly supplied (it is not).
          wmill workspace add "$WMILL_WORKSPACE" "$WMILL_WORKSPACE" "$WMILL_URL" --token "$WMILL_TOKEN"

          # Generate folder metadata and preview only dental assets.
          wmill folder add-missing -y
          wmill generate-metadata f/dental --strict-folder-boundaries --yes

          # Dry run only: preview changes without modifying Windmill.
          wmill sync push \
            --base-url "$WMILL_URL" \
            --token "$WMILL_TOKEN" \
            --workspace "$WMILL_WORKSPACE" \
            --yes \
            --dry-run \
            --skip-secrets \
            --skip-resources \
            --includes "f/dental/**"
